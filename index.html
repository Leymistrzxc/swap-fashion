<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Fashion - Sign In</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-container">
        
        <!-- Top Image Section -->
        <div class="header-image">
            <img src="ue-building.jpg" alt="University of the East">
            <!-- This creates the inward curve at the bottom of the image -->
            <div class="curve-overlay"></div>
        </div>

        <!-- Content Section -->
        <div class="content">
            <h1>Sign in</h1>
            <p class="subtitle">Welcome back, Warrior! Enter your details.</p>

            <!-- The Form -->
            <form id="loginForm">
                
                <!-- Student Number -->
                <div class="input-group">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="text" id="studentNum" placeholder="Student Number" required>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <i class="fa-regular fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="Your UE Complete Email Address" required>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <i class="fa-solid fa-key icon"></i>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword()">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="options-row">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="btn-primary">Sign in</button>
            </form>

            <!-- OR Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Google Sign In Button -->
            <button type="button" class="btn-google" onclick="signInWithGoogle()">
                <i class="fa-brands fa-google"></i> Sign in with UE Gmail account
            </button>

        </div>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="app.js"></script>
</body>
</html>

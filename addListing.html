<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Fashion - Add Listing</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-container add-listing-page">

        <!-- Header -->
        <header class="add-header">
            <button class="back-btn" onclick="window.location.href='home.html'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1>Add Listing</h1>
            <div style="width: 40px;"></div> <!-- Spacer to center the title -->
        </header>

        <main class="add-content">
            <form id="addItemForm" onsubmit="submitItem(event)">
                
                <!-- Photo Upload -->
                <div class="upload-box" onclick="alert('Photo upload coming soon!')">
                    <div class="upload-icon"><i class="fa-solid fa-camera"></i></div>
                    <p>Upload a photo</p>
                    <span>JPG, PNG (Max 5MB)</span>
                </div>

                <!-- Form Fields -->
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" placeholder="e.g. Black Blazer" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select required>
                            <option value="" disabled selected>Select</option>
                            <option value="formal">Formal</option>
                            <option value="casual">Casual</option>
                            <option value="cosplay">Cosplay</option>
                            <option value="sports">Sports</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Size</label>
                        <select required>
                            <option value="" disabled selected>Select</option>
                            <option value="xs">XS</option>
                            <option value="s">S</option>
                            <option value="m">M</option>
                            <option value="l">L</option>
                            <option value="xl">XL</option>
                        </select>
                    </div>
                </div>

                <!-- Listing Type Toggle -->
                <div class="form-group">
                    <label>Listing Type</label>
                    <div class="listing-toggle">
                        <button type="button" class="type-btn active" onclick="setListingType('swap', this)">
                            <i class="fa-solid fa-arrows-rotate"></i> Swap
                        </button>
                        <button type="button" class="type-btn" onclick="setListingType('buy', this)">
                            <i class="fa-solid fa-bag-shopping"></i> Buy
                        </button>
                    </div>
                </div>

                <!-- Price (Hidden by default, shows if Buy is selected) -->
                <div class="form-group" id="priceGroup" style="display: none;">
                    <label>Price (₱)</label>
                    <input type="number" placeholder="e.g. 350" min="0">
                </div>

                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea placeholder="Condition, flaws, meetup preferences..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Post Listing</button>
            </form>
        </main>

        <!-- Bottom Nav (Copy from other pages) -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="notifications.html" class="nav-item"><i class="fa-regular fa-bell"></i><span>Notification</span></a>
            <a href="add-listing.html" class="nav-item nav-add active"><i class="fa-solid fa-plus"></i></a>
            <a href="inbox.html" class="nav-item"><i class="fa-regular fa-envelope"></i><span>Inbox</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
